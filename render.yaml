services:
  - type: web
    name: profitlife-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false
      - key: ENGINE_MAX_WORKERS
        value: "2"
      - key: CORS_ORIGINS
        value: "https://profitlife.in,https://www.profitlife.in"
